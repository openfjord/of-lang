<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{share}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The OpenFjord logo, next to the words: OpenFjord modeling language">
<meta name="twitter:card" content="summary_large_image">
<script src="{{assets}}/theme.js?v={{version}}"></script>
<link rel="stylesheet" href="{{assets}}/style.css?v={{version}}">
<link rel="stylesheet" href="{{assets}}/code.css?v={{version}}">
<link rel="stylesheet" href="{{assets}}/icons.css?v={{version}}">
</head>
<body>
<header>
<button id="menu" type="button" aria-expanded="false" aria-controls="pages">Menu</button>
<a class="site" href="{{home}}"><img src="{{logo}}" alt="" width="28" height="28">{{site}}</a>
<span class="tools">

</span>
</header>
<div class="layout">
<nav id="pages" aria-label="Pages">
{{nav}}
</nav>
<main>
<div class="content">
{{body}}
{{pager}}
</div>
</main>
</div>
{{analytics}}
</body>
</html>

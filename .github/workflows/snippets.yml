# Checks that every YAML snippet in the language reference is a valid part of
# the restaurant example, that each by-example page shows its package, and that
# each chapter of the introduction shows its package (scripts/check_snippets.py).
name: Snippets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - uses: astral-sh/setup-uv@v6

      - name: Check the snippets
        run: uv run scripts/check_snippets.py

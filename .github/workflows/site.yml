# Builds the documentation site from the Markdown files (scripts/build_site.py).
# A pull request only builds it, which checks the links. A push to main also
# publishes it to GitHub Pages.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # The token of the site in Cloudflare Web Analytics, a repository
      # variable. The pages of a pull request load no analytics.
      - name: Build the site
        run: uv run scripts/build_site.py _site
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ github.event_name != 'pull_request' && vars.CLOUDFLARE_ANALYTICS_TOKEN || '' }}

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

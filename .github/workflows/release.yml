# Publishes a release when a version tag (v0.1.0, v1.2.3, ...) is pushed.
# It also adds the cli/<version> tag that Go needs to find the module,
# because the module lives in the cli folder, not at the repository root.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="changelog/v${version%%.*}.md"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            /^---$/  { if (found) exit }
            found    { print }
          ' "$file" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "no entry for [$version] in $file"; exit 1
          fi
          cat release-notes.md

      - name: Check
        working-directory: cli
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt-ed: $unformatted"; exit 1; fi
          go vet ./...
          go test ./...

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="of-lang_${version}_${os}_${arch}"
            mkdir "build-$name"
            (cd cli && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "../build-$name/of-lang" ./cmd/of-lang)
            cp LICENSE cli/README.md "build-$name/"
            tar -czf "dist/$name.tar.gz" -C "build-$name" .
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Tag the Go module
        run: |
          git tag "cli/$GITHUB_REF_NAME" "$GITHUB_SHA"
          git push origin "cli/$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "of-lang ${GITHUB_REF_NAME#v}" --notes-file release-notes.md

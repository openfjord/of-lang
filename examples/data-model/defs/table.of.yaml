import:
  - from: file:names.of.yaml
    use: [Name, RetentionDays]
  - from: file:team.of.yaml
    use: [Team]
  - from: file:database.of.yaml
    use: [Database, ownedByTeam]
  - from: file:job.of.yaml
    use: [Job, readsTable, writesTable]

Table:
  is: Kind
  definition: A set of rows with one schema. A database stores the table.
  examples:
    - the order_lines table in the sales database
  notExamples:
    - a temporary copy that a test makes and then deletes
    - a view that the database calculates at each read
  fields:
    name:
      type: Name
    visibility:
      enum: [public, internal]
      default: internal
    retentionDays:
      type: RetentionDays
      optional: true
  links:
    inDatabase: exactly 1
    belongsToTeam: at most 1
    feedsTable: any number

CriticalTable:
  is: Kind
  extends: Table
  definition: A table that many jobs read, so a change to it needs extra care.

inDatabase:
  is: Link
  from: Table
  to: Database
  reads: "{from} is in {to}"
  definition: The database that stores the table.
  inverse: hasTable

belongsToTeam:
  is: Link
  from: Table
  to: Team
  reads: "{from} belongs to {to}"
  definition: The team that is responsible for the table through its database.

feedsTable:
  is: Link
  from: Table
  to: Table
  reads: "{from} feeds {to}"
  definition: Rows of the first table flow into the second table, directly or through other tables.
  chains: true

tableTeamFromDatabase:
  is: Derivative
  says: A table belongs to the team that owns its database.
  match:
    - link: inDatabase
      from: {$table: Table}
      to:   {$database: Database}
    - link: ownedByTeam
      from: {$database: Database}
      to:   {$team: Team}
  derive:
    - link: belongsToTeam
      from: $table
      to:   $team

tableFeedsTable:
  is: Derivative
  says: If a job reads a table, that table feeds every table that the job writes.
  match:
    - link: readsTable
      from: {$job: Job}
      to:   {$source: Table}
    - link: writesTable
      from: {$job: Job}
      to:   {$target: Table}
  derive:
    - link: feedsTable
      from: $source
      to:   $target

criticalTable:
  is: Derivative
  says: A table that more than two jobs read is critical.
  filter:
    - count:
        match:
          - link: readsTable
            from: {$reader: Job}
            to:   {$table: Table}
      is above:
        value: 2
  derive:
    - node: $table
      becomes: CriticalTable

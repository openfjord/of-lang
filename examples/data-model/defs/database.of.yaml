import:
  - from: file:names.of.yaml
    use: [Name, RetentionDays]
  - from: file:team.of.yaml
    use: [Team]

Database:
  is: Kind
  definition: A named store of tables. One team owns it.
  examples:
    - the sales database
  fields:
    name:
      type: Name
    retentionDays:
      type: RetentionDays
      optional: true
  links:
    ownedByTeam: exactly 1

ownedByTeam:
  is: Link
  from: Database
  to: Team
  reads: "{from} is owned by {to}"
  definition: The team that is responsible for the database.
  inverse: ownsDatabase

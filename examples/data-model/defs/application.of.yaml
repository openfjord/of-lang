import:
  - from: file:names.of.yaml
    use: [Name]
  - from: file:table.of.yaml
    use: [Table]
  - from: file:job.of.yaml
    use: [Job, hasJob, jobOf, readsTable, writesTable]

Application:
  is: Kind
  definition: A deployable program that runs jobs.
  fields:
    name:
      type: Name
  links:
    dependsOnApp: any number
    consumesContract: any number

Contract:
  is: Kind
  definition: A promise from an application to keep some of its tables stable, so that other applications can read them.
  fields:
    name:
      type: Name
  links:
    coversTable: at least 1

dependsOnApp:
  is: Link
  from: Application
  to: Application
  reads: "{from} depends on {to}"
  definition: The first application fails if the second application changes the tables that it writes.

consumesContract:
  is: Link
  from: Application
  to: Contract
  reads: "{from} consumes {to}"
  definition: The application needs the tables that the contract covers.

coversTable:
  is: Link
  from: Contract
  to: Table
  reads: "{from} covers {to}"
  definition: The contract keeps this table stable.

appDependsOnWriter:
  is: Derivative
  says: >
    An application depends on every other application whose jobs write a
    table that one of its own jobs reads.
  match:
    - link: hasJob
      from: {$app: Application}
      to:   {$reader: Job}
    - link: readsTable
      from: {$reader: Job}
      to:   {$table: Table}
    - link: writesTable
      from: {$writer: Job}
      to:   {$table: Table}
    - link: jobOf
      from: {$writer: Job}
      to:   {$other: Application}
  filter:
    - node: $other
      does not equal:
        same as: $app
  derive:
    - link: dependsOnApp
      from: $app
      to:   $other

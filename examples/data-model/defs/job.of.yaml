import:
  - from: file:names.of.yaml
    use: [Name]
  - from: file:table.of.yaml
    use: [Table]
  - from: file:application.of.yaml
    use: [Application]

Job:
  is: Kind
  definition: A unit of work that an application runs. A job reads and writes tables.
  fields:
    name:
      type: Name
  links:
    jobOf: exactly 1
    readsTable: any number
    writesTable: any number

jobOf:
  is: Link
  from: Job
  to: Application
  reads: "{from} is a job of {to}"
  definition: The application that runs the job.
  inverse: hasJob

usesTable:
  is: Link
  from: Job
  to: Table
  reads: "{from} uses {to}"
  definition: The job reads or writes the table when it runs.

readsTable:
  is: Link
  from: Job
  to: Table
  reads: "{from} reads {to}"
  definition: The job reads rows from the table when it runs.
  under: usesTable
  inverse: readByJob

writesTable:
  is: Link
  from: Job
  to: Table
  reads: "{from} writes {to}"
  definition: The job writes rows to the table when it runs.
  under: usesTable
  inverse: writtenByJob

import:
  - from: file:recipe.of.yaml
    use: [Recipe, Dish, usesRecipe, usesIngredient]
  - from: file:ingredient.of.yaml
    use: [Ingredient, Allergen, containsAllergen]

hasAllergen:
  is: Link
  from: Recipe
  to: Allergen
  reads: "{from} contains {to}"
  definition: The allergen is in the recipe, through one of its ingredients or one of its recipes.

listsAllergen:
  is: Link
  from: Dish
  to: Allergen
  reads: "the menu tells guests that {from} contains {to}"
  definition: The menu gives a warning about the allergen next to the dish.

allergenFromIngredient:
  is: Derivative
  says: A recipe contains each allergen that one of its ingredients contains.
  match:
    - link: usesIngredient
      from: {$recipe: Recipe}
      to:   {$ingredient: Ingredient}
    - link: containsAllergen
      from: {$ingredient: Ingredient}
      to:   {$allergen: Allergen}
  derive:
    - link: hasAllergen
      from: $recipe
      to:   $allergen

allergenFromRecipe:
  is: Derivative
  says: A recipe contains each allergen that one of its recipes contains.
  match:
    - link: usesRecipe
      from: {$recipe: Recipe}
      to:   {$part: Recipe}
    - link: hasAllergen
      from: {$part: Recipe}
      to:   {$allergen: Allergen}
  derive:
    - link: hasAllergen
      from: $recipe
      to:   $allergen

dishListsItsAllergens:
  is: Constraint
  says: >
    The menu must give a warning about each allergen in an active dish.
  match:
    - link: hasAllergen
      from: {$dish: Dish}
      to:   {$allergen: Allergen}
  filter:
    - node:  $dish
      field: status
      equals:
        value: active
  unless:
    - at least one:
        match:
          - link: listsAllergen
            from: {$dish: Dish}
            to:   {$allergen: Allergen}
  message: "The menu must warn that {$dish} contains {$allergen}."

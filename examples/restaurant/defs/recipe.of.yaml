import:
  - from: file:names.of.yaml
    use: [Name, Minutes, Price]
  - from: file:station.of.yaml
    use: [Station]
  - from: file:ingredient.of.yaml
    use: [Ingredient]
  - from: file:allergens.of.yaml
    use: [hasAllergen, listsAllergen]

Recipe:
  is: Kind
  definition: The steps that make one food from ingredients and other recipes.
  examples:
    - the tomato sauce
    - the pizza dough
  notExamples:
    - a food that the restaurant buys and does not make, such as flour
    - a new dish that a cook tries one time and does not keep
  fields:
    name:
      type: Name
    prepMinutes:
      type: Minutes
      optional: true
  links:
    madeAtStation: exactly 1
    usesRecipe: any number
    usesIngredient: any number
    usesGarnish: any number
    hasAllergen: any number

Dish:
  is: Kind
  extends: Recipe
  definition: A recipe that the restaurant sells to guests.
  examples:
    - the pizza margherita
  notExamples:
    - the tomato sauce, which is only a part of a dish
  fields:
    price:
      type: Price
    status:
      enum: [active, retired]
      default: active
  links:
    listsAllergen: any number

BaseRecipe:
  is: Kind
  extends: Recipe
  definition: A recipe that many other recipes use, so a change to it needs extra care.

madeAtStation:
  is: Link
  from: Recipe
  to: Station
  reads: "{from} is made at {to}"
  definition: The station where cooks make the recipe.
  inverse: makesRecipe

usesRecipe:
  is: Link
  from: Recipe
  to: Recipe
  reads: "{from} uses {to}"
  definition: The first recipe needs the second recipe, directly or through other recipes.
  chains: true
  inverse: usedByRecipe

usesIngredient:
  is: Link
  from: Recipe
  to: Ingredient
  reads: "{from} uses {to}"
  definition: The recipe needs the ingredient.

usesGarnish:
  is: Link
  from: Recipe
  to: Ingredient
  reads: "{from} is garnished with {to}"
  definition: The cook puts the ingredient on the food at the end, to make it look or taste better.
  under: usesIngredient

baseRecipe:
  is: Derivative
  says: >
    A recipe that more than two other recipes use, directly or through other
    recipes, is a base recipe.
  filter:
    - count:
        match:
          - link: usesRecipe
            from: {$user: Recipe}
            to:   {$recipe: Recipe}
      is above:
        value: 2
  derive:
    - node: $recipe
      becomes: BaseRecipe

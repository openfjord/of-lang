Dish:
  is: Kind
  definition: A food that the restaurant sells to guests.
  fields:
    portionsLeft:
      type: integer
      minimum: 0

    soldOut:
      type: boolean
      optional: true

soldOutFromPortions:
  is: Derivative
  says: A dish with no portions left is sold out.
  match:
    - kind: { name: Dish, as: $dish }
  filter:
    - node:  $dish
      field: portionsLeft
      equals:
        value: 0

  derive:
    - node:  $dish
      field: soldOut
      set to:
        value: true

import:
  - from: file:../../defs/dish.of.yaml
    use: [Dish]

dish/margherita:
  is: Fact
  kind: Dish
  fields:
    portionsLeft: 12

dish/fondue:
  is: Fact
  kind: Dish
  fields:
    portionsLeft: 0

noFondueLeft:
  is: Test
  says: The kitchen has no fondue and twelve portions of margherita, so only the fondue is sold out.
  expect:
    derived:
      - node:  dish/fondue
        field: soldOut
        set to:
          value: true
    notDerived:
      - node:  dish/margherita
        field: soldOut
        set to:
          value: true

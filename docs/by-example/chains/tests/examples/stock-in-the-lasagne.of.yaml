import:
  - from: file:../../defs/recipe.of.yaml
    use: [Recipe, usesRecipe]

recipe/stock:
  is: Fact
  kind: Recipe

recipe/ragu:
  is: Fact
  kind: Recipe
  links:
    usesRecipe: recipe/stock

recipe/lasagne:
  is: Fact
  kind: Recipe
  links:
    usesRecipe: recipe/ragu

stockInTheLasagne:
  is: Test
  says: The lasagne uses the ragu, which uses the stock. Thus, the lasagne uses the stock.
  expect:
    derived:
      - link: usesRecipe
        from: recipe/lasagne
        to:   recipe/stock

    notDerived:
      - link: usesRecipe
        from: recipe/stock
        to:   recipe/lasagne

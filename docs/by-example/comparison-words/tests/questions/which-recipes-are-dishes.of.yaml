import:
  - from: file:../../defs/recipe.of.yaml
    use: [Recipe, Dish]

whichRecipesAreDishes:
  is: Question
  asks: Which recipes are dishes?
  given: file:../examples/four-recipes.of.yaml
  match:
    - kind: { name: Recipe, as: $recipe }
  filter:
    - node: $recipe
      is a: Dish
  expect:
    $recipe: [dish/margherita, dish/fondue]

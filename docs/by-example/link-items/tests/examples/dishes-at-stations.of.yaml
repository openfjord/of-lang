import:
  - from: file:../../defs/kitchen.of.yaml
    use: [Dish, Station, madeAtStation]

station/pizza:
  is: Fact
  kind: Station
  fields:
    name: pizza

station/grill:
  is: Fact
  kind: Station
  fields:
    name: grill

dish/margherita:
  is: Fact
  kind: Dish
  fields:
    name: margherita
  links:
    madeAtStation: station/pizza

dish/fondue:
  is: Fact
  kind: Dish
  fields:
    name: fondue

dishesAtStations:
  is: Test
  says: A dish with a station and a dish without a station are both valid.
  expect:
    rejected: []

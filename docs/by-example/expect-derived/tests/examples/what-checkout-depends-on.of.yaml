import:
  - from: file:../../defs/service.of.yaml
    use: [Service, dependsOn]

service/database:
  is: Fact
  kind: Service

service/orders:
  is: Fact
  kind: Service
  links:
    dependsOn: service/database

service/checkout:
  is: Fact
  kind: Service
  links:
    dependsOn: service/orders

service/search:
  is: Fact
  kind: Service

whatCheckoutDependsOn:
  is: Test
  says: >
    Checkout depends on orders, which depends on the database. Thus,
    checkout depends on the database. Search does not depend on the
    database.
  expect:
    derived:
      - link: dependsOn
        from: service/checkout
        to:   service/database
    notDerived:
      - link: dependsOn
        from: service/search
        to:   service/database

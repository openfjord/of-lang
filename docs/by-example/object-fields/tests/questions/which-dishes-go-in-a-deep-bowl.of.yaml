import:
  - from: file:../../defs/dish.of.yaml
    use: [Dish]

whichDishesGoInADeepBowl:
  is: Question
  asks: Which dishes go in a deep bowl?
  given: file:../examples/two-dishes.of.yaml
  match:
    - kind: { name: Dish, as: $dish }
  filter:
    - node: $dish
      field: plating
      part: plate
      equals:
        value: deep bowl
  expect:
    $dish: [dish/minestrone]

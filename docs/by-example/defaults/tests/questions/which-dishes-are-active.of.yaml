import:
  - from: file:../../defs/dish.of.yaml
    use: [Dish]

whichDishesAreActive:
  is: Question
  asks: Which dishes are active?
  given: file:../examples/two-dishes.of.yaml
  match:
    - kind: { name: Dish, as: $dish }
  filter:
    - node: $dish
      field: status
      equals:
        value: active
  expect:
    $dish: [dish/margherita]

import:
  - from: file:../../defs/service.of.yaml
    use: [Service, dependsOn]

service/checkout:
  is: Fact
  kind: Service
  fields:
    name: checkout
  links:
    dependsOn: service/orders

service/orders:
  is: Fact
  kind: Service
  fields:
    name: orders
  links:
    dependsOn: service/database

service/database:
  is: Fact
  kind: Service
  fields:
    name: database

service/search:
  is: Fact
  kind: Service
  fields:
    name: search

fourServices:
  is: Test
  says: Three services that depend on each other in a sequence, and a fourth service, are valid.
  expect:
    rejected: []

import:
  - from: file:../../defs/product.of.yaml
    use: [Service, Table, readsTable]

table/products:
  is: Fact
  kind: Table
  fields:
    name: products
    personalData: false

table/customers:
  is: Fact
  kind: Table
  fields:
    name: customers
    personalData: true

service/search:
  is: Fact
  kind: Service
  fields:
    name: search
  links:
    readsTable: table/products

service/checkout:
  is: Fact
  kind: Service
  fields:
    name: checkout
  links:
    readsTable: [table/products, table/customers]

twoTables:
  is: Test
  says: A service that reads personal data and a service that reads none are both valid.
  expect:
    rejected: []

Service:
  is: Kind
  definition: A program that runs in production and answers requests.
  fields:
    name:
      type: string
    replicas:
      type: integer

Table:
  is: Kind
  definition: A table in a database.
  fields:
    name:
      type: string

readsTable:
  is: Link
  from: Service
  to: Table
  reads: "{from} reads {to}"
  definition: The service gets rows from the table.

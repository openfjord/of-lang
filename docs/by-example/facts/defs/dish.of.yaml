Dish:
  is: Kind
  definition: A food that the restaurant sells to guests.
  fields:
    name:
      type: string
    price:
      type: number

Ingredient:
  is: Kind
  definition: A raw food that the restaurant buys.
  fields:
    name:
      type: string

usesIngredient:
  is: Link
  from: Dish
  to: Ingredient
  reads: "{from} uses {to}"
  definition: The dish needs the ingredient.

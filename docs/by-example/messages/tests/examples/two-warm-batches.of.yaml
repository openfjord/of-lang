import:
  - from: file:../../defs/batch.of.yaml
    use: [Batch, batchKeptColdEnough]

batch/parmesan_monday:
  is: Fact
  kind: Batch
  fields:
    keepAtMostCelsius: 8
    keptAtCelsius: 12
    shelf: B2

batch/cream_tuesday:
  is: Fact
  kind: Batch
  fields:
    keepAtMostCelsius: 4
    keptAtCelsius: 6

twoWarmBatches:
  is: Test
  says: The two batches are warmer than is safe for them, so the constraint rejects them.
  expect:
    rejected: [batchKeptColdEnough]

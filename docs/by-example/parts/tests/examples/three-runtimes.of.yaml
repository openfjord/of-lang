import:
  - from: file:../../defs/service.of.yaml
    use: [Service]

service/checkout:
  is: Fact
  kind: Service
  fields:
    name: checkout
    runtime:
      language: go
      version: "1.24"

service/orders:
  is: Fact
  kind: Service
  fields:
    name: orders
    runtime:
      language: go

service/search:
  is: Fact
  kind: Service
  fields:
    name: search
    runtime:
      language: python

threeRuntimes:
  is: Test
  says: Services in Go and in Python are valid, with or without a version.
  expect:
    rejected: []

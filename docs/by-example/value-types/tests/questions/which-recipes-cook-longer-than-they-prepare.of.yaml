import:
  - from: file:../../defs/recipe.of.yaml
    use: [Recipe]

whichRecipesCookLongerThanTheyPrepare:
  is: Question
  asks: Which recipes take more time to cook than to prepare?
  given: file:../examples/two-recipes.of.yaml
  match:
    - kind: { name: Recipe, as: $recipe }
  filter:
    - node: $recipe
      field: cookMinutes
      is above:
        same as:
          node: $recipe
          field: prepMinutes
  expect:
    $recipe: [recipe/ragu]

import:
  - from: file:../../defs/kitchen.of.yaml
    use: [Dish, Ingredient, usesIngredient]

ingredient/tomatoes:
  is: Fact
  kind: Ingredient
  fields:
    name: tomatoes
    storage: fresh

ingredient/basil:
  is: Fact
  kind: Ingredient
  fields:
    name: basil
    storage: fresh

ingredient/shrimp:
  is: Fact
  kind: Ingredient
  fields:
    name: shrimp
    storage: frozen

dish/margherita:
  is: Fact
  kind: Dish
  fields:
    name: margherita
  links:
    usesIngredient: [ingredient/tomatoes, ingredient/basil]

dish/scampi:
  is: Fact
  kind: Dish
  fields:
    name: scampi
  links:
    usesIngredient: [ingredient/tomatoes, ingredient/shrimp]

dish/bread:
  is: Fact
  kind: Dish
  fields:
    name: bread

threeDishes:
  is: Test
  says: Dishes with fresh ingredients, with a frozen ingredient and with no ingredients are valid.
  expect:
    rejected: []

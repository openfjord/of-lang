import:
  - from: file:../../defs/recipe.of.yaml
    use: [Recipe, Station, madeAtStation, makesRecipe]

station/sauce:
  is: Fact
  kind: Station

recipe/pesto:
  is: Fact
  kind: Recipe
  links:
    madeAtStation: station/sauce

recipe/margherita:
  is: Fact
  kind: Recipe

station/pizza:
  is: Fact
  kind: Station
  links:
    makesRecipe: recipe/margherita

twoStations:
  is: Test
  says: Each of the two stations makes one recipe.
  expect:
    derived:
      - link: madeAtStation
        from: recipe/margherita
        to:   station/pizza

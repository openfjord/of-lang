import:
  - from: file:../../defs/station.of.yaml
    use: [Station]
  - from: file:../../defs/recipe.of.yaml
    use: [Recipe, Dish, madeAtStation, usesRecipe, usesIngredient, usesGarnish]
  - from: file:../../defs/ingredient.of.yaml
    use: [Ingredient, Allergen, containsAllergen]
  - from: file:../../defs/allergens.of.yaml
    use: [listsAllergen]

allergenThroughASauce:
  is: Test
  says: >
    Parmesan is on the margherita as a garnish. A garnish is an ingredient,
    so the margherita uses parmesan. The marinara has no garnish, so it does
    not use parmesan.
  expect:
    derived:
      - link: usesIngredient
        from: dish/margherita
        to:   ingredient/parmesan
    notDerived:
      - link: usesIngredient
        from: dish/marinara
        to:   ingredient/parmesan

station/pizza:
  is: Fact
  kind: Station
  fields:
    name: pizza

station/sauce:
  is: Fact
  kind: Station
  fields:
    name: sauce

allergen/nuts:
  is: Fact
  kind: Allergen
  fields:
    name: nuts

allergen/milk:
  is: Fact
  kind: Allergen
  fields:
    name: milk

ingredient/pine_nuts:
  is: Fact
  kind: Ingredient
  fields:
    name: pine_nuts
  links:
    containsAllergen: allergen/nuts

ingredient/parmesan:
  is: Fact
  kind: Ingredient
  fields:
    name: parmesan
  links:
    containsAllergen: allergen/milk

ingredient/tomatoes:
  is: Fact
  kind: Ingredient
  fields:
    name: tomatoes

recipe/pesto:
  is: Fact
  kind: Recipe
  fields:
    name: pesto
    steps: https://recipes.example.com/pesto
  links:
    madeAtStation: station/sauce
    usesIngredient: ingredient/pine_nuts

recipe/tomato_sauce:
  is: Fact
  kind: Recipe
  fields:
    name: tomato_sauce
    steps: https://recipes.example.com/tomato_sauce
  links:
    madeAtStation: station/sauce
    usesIngredient: ingredient/tomatoes

dish/margherita:
  is: Fact
  kind: Dish
  fields:
    name: margherita
    steps: https://recipes.example.com/margherita
    price: 12
  links:
    madeAtStation: station/pizza
    usesRecipe: [recipe/tomato_sauce, recipe/pesto]
    usesGarnish: ingredient/parmesan
    listsAllergen: [allergen/nuts, allergen/milk]

dish/marinara:
  is: Fact
  kind: Dish
  fields:
    name: marinara
    steps: https://recipes.example.com/marinara
    price: 10
  links:
    madeAtStation: station/pizza
    usesRecipe: recipe/tomato_sauce
